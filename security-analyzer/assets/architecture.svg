<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032" />
      <stop offset="100%" stop-color="#101726" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    SECURITY ANALYZER — <tspan fill="#10b981">MODULAR ARCHITECTURE</tspan>
  </text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">
    Chrome Manifest V3 Passive Pipeline with Isolated &amp; Main Worlds and Optional SSRF Guard
  </text>

  <!-- Left: Chrome Tab & Content Scripts -->
  <g transform="translate(40, 100)">
    <rect width="260" height="380" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="74" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">Active Chrome Tab</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 52)">
      <rect width="230" height="65" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">Document Object Model</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Meta generator, scripts, links,</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">DOM selectors, cookie identifiers</text>
    </g>

    <g transform="translate(15, 130)">
      <rect width="230" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">page-script.js (MAIN World)</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Inspects window.React, window.Vue,</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">window.jQuery runtime globals</text>
    </g>

    <g transform="translate(15, 208)">
      <rect width="230" height="65" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fcd34d">content-script.js (ISOLATED)</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Coordinates DOM event messaging</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Transmits sanitized pageData</text>
    </g>

    <g transform="translate(15, 286)">
      <rect width="230" height="75" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">HTTP Response Headers</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">Server, X-Powered-By, CSP,</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b">HSTS, X-Content-Type-Options</text>
    </g>
  </g>

  <!-- Center: Background & Core Engine -->
  <g transform="translate(340, 100)">
    <rect width="320" height="380" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" filter="url(#shadow)" />
    <rect x="0" y="0" width="320" height="36" rx="10" fill="#064e3b" />
    <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#a7f3d0" letter-spacing="0.5">CORE AUDIT &amp; DETECTION ENGINE</text>

    <!-- Sub-blocks -->
    <g transform="translate(15, 50)">
      <rect width="290" height="48" rx="6" fill="#0b1120" stroke="#1e293b" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fff">Technology Detector (detector.js)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">fingerprints.json matching &amp; confidence scoring</text>
    </g>

    <g transform="translate(15, 106)">
      <rect width="290" height="48" rx="6" fill="#0b1120" stroke="#1e293b" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fff">Version Classifier (version-detector.js)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Exact vs Inferred vs Partial vs Unknown</text>
    </g>

    <g transform="translate(15, 162)">
      <rect width="290" height="48" rx="6" fill="#0b1120" stroke="#1e293b" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fff">Security Posture (security-analyzer.js)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">HSTS, CSP, XFO, MIME, Token disclosures</text>
    </g>

    <g transform="translate(15, 218)">
      <rect width="290" height="48" rx="6" fill="#0b1120" stroke="#1e293b" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fff">Vulnerability Intel (vuln-intel.js)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">Curated CVE dataset &amp; CVSS score alignment</text>
    </g>

    <g transform="translate(15, 274)">
      <rect width="290" height="48" rx="6" fill="#0b1120" stroke="#1e293b" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fff">Safe Deep Scanner (deep-scanner.js)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">security.txt, robots.txt disallows, script banners</text>
    </g>

    <g transform="translate(15, 330)">
      <rect width="290" height="40" rx="6" fill="#0b1120" stroke="#1e293b" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#fff">Reporter (reporter.js)</text>
      <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">JSON &amp; CSV export serializer with disclaimers</text>
    </g>
  </g>

  <!-- Right: UI & Optional Backend -->
  <g transform="translate(700, 100)">
    <!-- Popup UI Card -->
    <rect width="260" height="215" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#1e293b" />
    <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#cbd5e1">Extension Popup (8 Cyber Tabs)</text>
    <g transform="translate(12, 48)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#10b981">1. Overview (Score, Grade, Metric)</text>
      <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">2. Technologies (Search &amp; Filter)</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">3. Versions (Reliability Status)</text>
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">4. Security (Severity Accordions)</text>
      <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">5. CVE Intel (Advisories &amp; CVSS)</text>
      <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">6. Deep Scan (RFC 9116 Probes)</text>
      <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">7. Export (JSON &amp; CSV Downloads)</text>
      <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">8. Settings (API &amp; Scan Controls)</text>
    </g>

    <!-- Optional Python Backend Card -->
    <g transform="translate(0, 230)">
      <rect width="260" height="150" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,4" filter="url(#shadow)" />
      <rect x="0" y="0" width="260" height="32" rx="10" fill="#0f172a" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">Optional FastAPI Backend</text>
      
      <g transform="translate(12, 44)">
        <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#fff">🛡️ SSRF Guard (ssrf_guard.py)</text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b">Blocks RFC 1918, loopbacks, 169.254</text>
        
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" fill="#fff">⚡ API Router (main.py)</text>
        <text x="0" y="67" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#64748b">/api/health, /api/scan, /api/vulns</text>

        <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#10b981">✓ Extension runs fully offline if absent</text>
      </g>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 300 230 L 340 230" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="340,230 334,226 334,234" fill="#10b981" />

  <path d="M 660 210 L 700 210" stroke="#10b981" stroke-width="2" />
  <polygon points="700,210 694,206 694,214" fill="#10b981" />
</svg>
