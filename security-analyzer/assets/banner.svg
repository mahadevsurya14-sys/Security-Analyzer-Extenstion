<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Ambient Radar Circles -->
  <circle cx="1020" cy="180" r="220" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.1" />
  <circle cx="1020" cy="180" r="160" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="4,8" />
  <circle cx="1020" cy="180" r="100" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.2" />
  <circle cx="1020" cy="180" r="40" fill="url(#glowGrad)" stroke="#34d399" stroke-width="2" stroke-opacity="0.4" />

  <!-- Radar Sweep Line -->
  <line x1="1020" y1="180" x2="1180" y2="90" stroke="#34d399" stroke-width="2" stroke-opacity="0.6" />

  <!-- Circuit Accents -->
  <path d="M 50 40 L 240 40 L 270 70 L 600 70" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="50" cy="40" r="4" fill="#10b981" />
  <circle cx="600" cy="70" r="4" fill="#34d399" />

  <path d="M 80 320 L 320 320 L 350 290 L 850 290" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" />
  <circle cx="80" cy="320" r="4" fill="#10b981" />
  <circle cx="850" cy="290" r="4" fill="#10b981" />

  <!-- Left Logo Shield -->
  <g transform="translate(100, 80)">
    <!-- Outer Glow -->
    <circle cx="80" cy="80" r="70" fill="url(#glowGrad)" filter="url(#neonGlow)" />
    <!-- Shield Container -->
    <rect x="10" y="10" width="140" height="140" rx="28" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#neonGlow)" />
    <!-- Shield Contour -->
    <path d="M 80 30 L 120 48 V 86 C 120 112 102 134 80 144 C 58 134 40 112 40 86 V 48 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Radar Core -->
    <circle cx="80" cy="86" r="18" fill="none" stroke="#34d399" stroke-width="3.5" />
    <circle cx="80" cy="86" r="6" fill="#10b981" />
    <!-- Crosshairs -->
    <line x1="80" y1="60" x2="80" y2="72" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="80" y1="100" x2="80" y2="112" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="54" y1="86" x2="66" y2="86" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <line x1="94" y1="86" x2="106" y2="86" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(290, 115)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
    <circle cx="14" cy="13" r="5" fill="#34d399" />
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1">CHROME MANIFEST V3</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      SECURITY <tspan fill="url(#cyberGreen)">ANALYZER</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.4">
      Passive Cybersecurity Audit, Fingerprinting &amp; Vulnerability Intelligence
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 135)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🛡️ Non-Destructive</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="154" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">🔍 40+ Tech Signatures</text>

      <!-- Pill 3 -->
      <rect x="285" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="299" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">📊 CVE Intel &amp; NVD</text>

      <!-- Pill 4 -->
      <rect x="420" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="434" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" fill="#cbd5e1">⚡ SSRF-Protected API</text>
    </g>
  </g>
</svg>
